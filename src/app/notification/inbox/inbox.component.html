<section class="content">
    <div class="container-fluid">
        <div class="block-header">
            <div class="row">
                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                    <ul class="breadcrumb breadcrumb-style ">
                        <li class="breadcrumb-item">
                            <h4 class="page-title">Notifications</h4>
                        </li>
                        <li class="breadcrumb-item bcrumb-1">
                            <a routerLink="/pages/dashboard/staff-dashboard">
                                <i class="fas fa-home"></i> Home</a>
                        </li>
                        <li class="breadcrumb-item bcrumb-2">
                            <a href="#" onClick="return false;">Email</a>
                        </li>
                        <li class="breadcrumb-item active">Notifications</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12" style="margin-bottom: 0px;">
                <div class="card" style="margin-bottom: 0px;">
                    <div class="boxs mail_listing">
                        <div class="inbox-center tableBody table-responsive" style="position : relative; height: calc(100vh - 200px);"
                        [perfectScrollbar]>
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th colspan="3">
                                            <div class="inbox-header">
                                                <div class="mail-option no-pad-left">
                                                    <div class="email-btn-group m-l-15">

                                                        <button mat-icon-button (click)="removeSelectedRows()"
                                                            aria-label="Example icon-button with a heart icon">
                                                            <mat-icon>delete</mat-icon>
                                                        </button>

                                                    </div>
                                                </div>
                                            </div>
                                        </th>
                                        <th class="hidden-xs" colspan="2">
                                            <div class="pull-right">
                                                <div class="email-btn-group m-l-15">
                                                    <button mat-icon-button
                                                        aria-label="Example icon-button with a heart icon">
                                                        <mat-icon>navigate_before</mat-icon>
                                                    </button>
                                                    <button mat-icon-button
                                                        aria-label="Example icon-button with a heart icon">
                                                        <mat-icon>navigate_next</mat-icon>
                                                    </button>
                                                </div>
                                            </div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let notification of notifications" class="unread">
                                        <td class="tbl-checkbox">
                                            <mat-checkbox class="example-margin"
                                                (change)="toggle($event, notification.notification.id)"></mat-checkbox>
                                        </td>
                                        <td class="hidden-xs">
                                            <i class="material-icons">star_border</i>
                                        </td>
                                        <td class="hidden-xs">{{staffMap.get(notification.notification.createdBy)}}</td>
                                        <td class="max-texts">

                                            <span
                                                class="label l-bg-purple shadow-style m-r-10">{{notification.notification.notificationType}}</span>
                                            {{notification.notification.notificationName}}
                                        </td>
                                        <td class="text-right"> {{notification.notification.publishedOn | date :'MMMM
                                            d'}}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="row">
                            <div class="col-sm-7 ">
                                <p class="p-15">Showing 1 - 15 of 200</p>
                            </div>
                            <div class="col-sm-5 text-right">
                                <div class="pull-right">
                                    <div class="email-btn-group m-l-15">
                                        <button mat-icon-button aria-label="Example icon-button with a heart icon">
                                            <mat-icon>navigate_before</mat-icon>
                                        </button>
                                        <button mat-icon-button aria-label="Example icon-button with a heart icon">
                                            <mat-icon>navigate_next</mat-icon>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

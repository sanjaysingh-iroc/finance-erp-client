<nav #navbar class="navbar active">
  <div class="container-fluid">
    <div class="navbar-header">
      <a href="#" onClick="return false;" class="navbar-toggle collapsed" data-toggle="collapse"
        data-target="#navbar-collapse" aria-expanded="false"></a>
      <a href="#" onClick="return false;" class="bars" (click)="mobileMenuSidebarOpen($event,'overlay-open')"></a>
      <a class="navbar-brand" [routerLink]="homeLink">
        <img [src]='company ? apiURL+company.logoImg : "assets/images/logo.png"'
          onError="this.src='assets/images/logo.png'" alt="logo" width="50" height="38" />
        <span class="logo-name" style="font-family: cursive">i-Class</span>
      </a>
    </div>
    <div class="collapse navbar-collapse" id="navbar-collapse">
      <ul class="pull-left collapse-menu-icon">
        <li>
          <button mat-icon-button (click)="callSidemenuCollapse()" class="sidemenu-collapse">
            <mat-icon>menu</mat-icon>
          </button>
        </li>
      </ul>

      <ul class="nav navbar-nav navbar-right">
        <!-- Full Screen Button -->
        <li class="dropdown" style="padding-right: 80px;">
          <mat-form-field appearance="outline">
            <mat-label>Search People</mat-label>
            <input matInput [formControl]="search" (keydown.enter)="redirectToSearch()">
            <mat-icon matPrefix>search</mat-icon>
          </mat-form-field>
        </li>
        <!-- Full Screen Button -->
        <li class="fullscreen">
          <button mat-icon-button (click)="callFullscreen()" class=" nav-notification-icons">
            <mat-icon>fullscreen</mat-icon>
          </button>
        </li>
        <!-- #END# Full Screen Button -->
        <!-- #START# Notifications-->
        <li class="dropdown">
          <button mat-icon-button data-toggle="dropdown" class=" nav-notification-icons">
            <mat-icon>notifications_none</mat-icon>
            <span class="label-count bg-orange"></span>
          </button>
          <ul class="dropdown-menu pullDown">
            <li class="header">NOTIFICATIONS</li>
          </ul>
        </li>
        <!-- #END# Notifications-->
        <li class="dropdown user_profile">
          <a href="#" onClick="return false;" data-toggle="dropdown" role="button" class="pt-0">
            <img [src]='uploadImg' (error)="updateUrl($event)" class="rounded-circle" width="32" height="32"
              alt="User" />
          </a>
          <ul class="dropdown-menu pullDown">
            <li class="body">
              <ul class="user_dw_menu">
                <li>
                  <a href="#" onClick="return false;" (click)="viewStaffProfile()">
                    <mat-icon aria-hidden="false" class="mr-2 ">person</mat-icon>Profile
                  </a>
                </li>
                <li>
                  <a href="#" onClick="return false;" (click)="changePassword()">
                    <mat-icon aria-hidden="false" class="mr-2 ">settings</mat-icon>Change Password
                  </a>
                </li>
                <li>
                  <a href="#" onClick="return false;" (click)="logout();">
                    <mat-icon aria-hidden="false" class="mr-2 ">power_settings_new
                    </mat-icon>Logout
                  </a>
                </li>
              </ul>
            </li>
          </ul>
        </li>
        <!-- #END# Tasks -->
        <li class="pull-right">
          <button mat-icon-button (click)="toggleRightSidebar()" class="nav-notification-icons js-right-sidebar">
            <mat-icon id="settingBtn">settings</mat-icon>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

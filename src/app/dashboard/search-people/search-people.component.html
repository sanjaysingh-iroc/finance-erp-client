<section class="content">
  <div class="container-fluid">
    <div class="block-header">
      <div class="row">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
          <ul class="breadcrumb breadcrumb-style ">
            <li class="breadcrumb-item">
              <h4 class="page-title">Search People</h4>
            </li>
            <li class="breadcrumb-item bcrumb-1">
              <a routerLink="/pages/dashboard/staff-dashboard">
                <i class="fas fa-home"></i> Home</a>
            </li>
            <li class="breadcrumb-item bcrumb-2">
              <a href="#" onClick="return false;">People</a>
            </li>
            <li class="breadcrumb-item active">Search</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="body">
            <form class="m-4" [formGroup]="classForm" (ngSubmit)="onSubmit()">
              <div class="row">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                  <mat-form-field style="width:80%" appearance="outline">
                    <mat-label>Search People</mat-label>
                    <input matInput formControlName="search" required>
                    <mat-icon matPrefix>search</mat-icon>
                  </mat-form-field>
                  <button type="submit" class="searchButton" style="font-size: 26px !important">
                    <i class="fa fa-search"></i>
                  </button>

                </div>
              </div>
            </form>

            <div class="row clearfix">
              <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
                <div class="card">
                  <div class="profile-tab-box">
                    <div class="p-l-20">
                      <ul class="nav ">
                        <li class="nav-item tab-all">
                          <a class="nav-link active show " data-toggle="tab" href="#customer">Customers</a>
                        </li>
                        <li class="nav-item tab-all">
                          <a class="nav-link" data-toggle="tab" href="#staff">Staff</a>
                        </li>
                      </ul>
                    </div>
                  </div>
                </div>
                <div class="tab-content">
                  <div role="tabpanel" class="tab-pane" id="staff" aria-expanded="true">
                    <div class="row clearfix">

                      <div class="col-lg-12 col-md-12 col-sm-12">
                        <div class="card project_widget">
                          <div class="body">
                            <table class="table table-hover ">
                              <thead>
                                <tr>
                                  <th>Staff Name</th>
                                  <th>Mobile</th>
                                  <th>Email</th>

                                  <th>View</th>
                                </tr>
                              </thead>
                              <tbody>
                                <tr *ngFor="let staff of staffs">
                                  <td>{{staff.name}}</td>
                                  <td>{{staff.mobile}}</td>
                                  <td>{{staff.email}}</td>
                                  <td><button mat-icon-button color="accent" class="btn-tbl-preview"
                                      (click)="$event.stopPropagation()" (click)="viewStaffProfile(staff)">
                                      <mat-icon aria-label="View" class="col-white">preview
                                      </mat-icon>
                                    </button></td>
                                </tr>
                              </tbody>
                            </table>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="content">
    <div class="container-fluid">
        <div class="block-header">
            <div class="row">
                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                    <ul class="breadcrumb breadcrumb-style ">
                        <li class="breadcrumb-item">
                            <h4 class="page-title">Dashboard ACL Settings</h4>
                        </li>
                        <li class="breadcrumb-item bcrumb-1">
                            <a routerLink="/billing/dashboard/staff-dashboard">
                                <i class="fas fa-home"></i> Home</a>
                        </li>
                        <li class="breadcrumb-item bcrumb-2">
                            <a href="#" onClick="return false;">Company</a>
                        </li>
                        <li class="breadcrumb-item active">Dashboard ACL</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="row clearfix">
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
                <div class="card">
                    <div class="body">
                        <form [formGroup]="stdForm" (ngSubmit)="onSubmit()">
                            <div class="row">
                                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12" style="margin-bottom: 0px;">
                                    <mat-form-field class="example-full-width" appearance="outline">
                                        <mat-label>Select User type</mat-label>
                                        <mat-select formControlName="userType"
                                            (selectionChange)="getAllDashboardAclDetails()" required>
                                            <mat-option *ngFor="let userType of userTypeList" [value]="userType.id">
                                                {{userType.name}}
                                            </mat-option>
                                        </mat-select>
                                        <mat-error *ngIf="stdForm.get('userType').hasError('required')">
                                            Select Any User Type
                                        </mat-error>
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="tableBody" style="position : relative; height: calc(100vh - 440px);"
                                [perfectScrollbar]>

                                <div class="row ">
                                    <div *ngFor="let cal of sidebarItems"
                                        class="col-xl-4 col-lg-4 col-md-4 col-sm-4 col-xs-12"
                                        style="margin-bottom: 0px;">
                                        <div class="card" style="margin-bottom: 15px;">
                                            <div class="card-statistic-2">
                                                <div class="align-items-center justify-content-between">
                                                    <div class="row ">
                                                        <div class="col-lg-6 col-md-6 col-sm-6 col-xs-6 pr-0 pt-3"
                                                            style="margin-bottom: 0px;">
                                                            <mat-checkbox class="example-margin" [id]="cal.id"
                                                                [checked]="selectmap.get(cal.id)"
                                                                (change)="toggle($event, cal.id)">
                                                                <h5 class="font-15">
                                                                    {{cal.moduleName}}</h5>
                                                            </mat-checkbox>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>


                            <div class="row">
                                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                                    <mat-spinner-button [options]="spinnerButtonOptions" [disabled]="!stdForm.valid">
                                    </mat-spinner-button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="limiter">
  <div class="container-login100">
    <div class="wrap-login100" style="height:calc(100vh - 100px)">

      <form class="login100-form validate-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <span class="login100-form-title pb-5">
          {{userTitle}} Login
        </span>

        <mat-error *ngIf="!isUserValid">
          username/password is wrong
        </mat-error>
        <div class="row">
          <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
            <mat-form-field class="example-full-width" appearance="outline">
              <mat-label>{{userTitle}}</mat-label>
              <input matInput formControlName="userName" mask="000-000-0000" [showMaskTyped]="true" />
              <mat-icon matSuffix>face</mat-icon>
              <mat-error *ngIf="loginForm.get('userName').hasError('required')">
                {{userTitle}} is required
              </mat-error>
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-xl-12col-lg-12 col-md-12 col-sm-12 mb-2">
            <mat-form-field class="example-full-width" appearance="outline">
              <mat-label>Password</mat-label>
              <input matInput [type]="hide ? 'password' : 'text'" formControlName="password">
              <button type="button" mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'"
                [attr.aria-pressed]="hide">
                <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
              <mat-error *ngIf="loginForm.get('password').hasError('required')">
                Password is required
              </mat-error>
            </mat-form-field>
          </div>
        </div>
        <!-- <div class="flex-sb-m w-full p-t-15 p-b-20">
          <div class="form-check">
            <label class="form-check-label">
              <input class="form-check-input" type="checkbox" value=""> Remember me
              <span class="form-check-sign">
                <span class="check"></span>
              </span>
            </label>
          </div>
          <div>
            <a class="txt1" routerLink="/auth/forgetPassword">Forgot Password?</a>
          </div>
        </div> -->
        <div class="container-login100-form-btn">
          <mat-spinner-button style="height: 100%; width: 100%;" [options]="spinnerButtonOptions">
          </mat-spinner-button>
        </div>
      </form>
      <div class="login100-more" style="height:100%;">
        <img style="width:100%;height:100%;object-fit: contain;" [src]='apiURL+"/company/downloadFile/login-bg.jpg"'
          onError="this.src='assets/images/pages/bg-01.png'">
      </div>
    </div>
  </div>

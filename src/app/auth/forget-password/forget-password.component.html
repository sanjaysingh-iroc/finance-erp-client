<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card shadow-lg border-0 rounded-lg mt-5">
        <div class="card-header">
          <h3 class="text-center font-weight-light my-4">Password Recovery</h3>
        </div>
        <div class="card-body">
          <div class="small mb-3 text-muted">Enter your email address and we will send you a link to reset your
            password.</div>
          <form [formGroup]="forgetPassword" (ngSubmit)="onSubmit()">
            <div class="form-group">
              <mat-form-field class="example-full-width" appearance="outline">
                <mat-label>Email</mat-label>
                <input matInput formControlName="email" required>
                <mat-error *ngIf="forgetPassword.get('email').hasError('required') && forgetPassword.get('email').touched">
                  Email is required
                </mat-error>
              </mat-form-field>
            </div>
            <div class="form-group d-flex align-items-center justify-content-between mt-4 mb-0">
              <a class="small" routerLink="/auth/login">Return to login</a>
              <button mat-flat-button color="primary" class="login100-form-btn" type="submit"
                [disabled]="!forgetPassword.valid">
                Reset Password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

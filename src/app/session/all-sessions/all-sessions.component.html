<section class="content">
    <div class="container-fluid">
        <div class="block-header">
            <div class="row">
                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                    <ul class="breadcrumb breadcrumb-style ">
                        <li class="breadcrumb-item">
                            <h4 class="page-title">All Session</h4>
                        </li>
                        <li class="breadcrumb-item bcrumb-1">
                            <a routerLink="/finance/dashboard/staff-dashboard">
                                <i class="fas fa-home"></i> Home</a>
                        </li>
                        <li class="breadcrumb-item bcrumb-2">
                            <a href="#" onClick="return false;">Session</a>
                        </li>
                        <li class="breadcrumb-item active">All</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="card">
                    <div class="body">
                        <div class="table-responsive">

                            <mat-table #table [dataSource]="dataSource" matSort class="mat-cell">

                                <ng-container matColumnDef="id">
                                    <mat-header-cell *matHeaderCellDef>Id</mat-header-cell>
                                    <mat-cell *matCellDef="let row">{{row.id}}</mat-cell>
                                </ng-container>

                                <ng-container matColumnDef="name">
                                    <mat-header-cell *matHeaderCellDef>Name</mat-header-cell>
                                    <mat-cell *matCellDef="let row">
                                        {{row.name}}</mat-cell>
                                </ng-container>

                                <ng-container matColumnDef="fromDate">
                                    <mat-header-cell *matHeaderCellDef>From Date</mat-header-cell>
                                    <mat-cell *matCellDef="let row">
                                        {{row.fromDate| date: showDateFormat}}</mat-cell>
                                </ng-container>

                                <ng-container matColumnDef="toDate">
                                    <mat-header-cell *matHeaderCellDef>To Date</mat-header-cell>
                                    <mat-cell *matCellDef="let row">
                                        {{row.toDate | date: showDateFormat}}</mat-cell>
                                </ng-container>


                                <!-- actions -->
                                <ng-container matColumnDef="actions">
                                    <mat-header-cell *matHeaderCellDef class="pr-0">Actions</mat-header-cell>
                                    <mat-cell *matCellDef="let row; let i=index;" class="pr-0">
                                        <button mat-icon-button color="accent" class="btn-tbl-edit"
                                            (click)="$event.stopPropagation()" (click)="editCall(row)">
                                            <mat-icon aria-label="Edit" class="col-white">edit</mat-icon>
                                        </button>
                                        <!-- <button mat-icon-button color="accent" class="btn-tbl-delete"
                                            (click)="$event.stopPropagation()" (click)="deleteItem(row)">
                                            <mat-icon aria-label="Delete" class="col-white">delete</mat-icon>
                                        </button> -->
                                    </mat-cell>
                                </ng-container>
                                <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                                <mat-row *matRowDef="let row; columns: displayedColumns;" matRipple>
                                </mat-row>
                            </mat-table>

                            <div class="no-results" [style.display]="dataSource.renderedData.length == 0 ? '' : 'none'">
                                No results
                            </div>
                            <mat-paginator #paginator [length]="dataSource.filteredData.length" [pageIndex]="0"
                                [pageSize]="100" [pageSizeOptions]="[5, 10, 25, 100]">
                            </mat-paginator>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

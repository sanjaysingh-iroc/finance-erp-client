<section class="content">
    <div class="container-fluid">
        <div class="block-header">
            <div class="row">
                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                    <ul class="breadcrumb breadcrumb-style ">
                        <li class="breadcrumb-item">
                            <h4 class="page-title">Update Session</h4>
                        </li>
                        <li class="breadcrumb-item bcrumb-1">
                            <a routerLink="/billing/session/all-session">
                                <i class="fas fa-home"></i> Home</a>
                        </li>
                        <li class="breadcrumb-item bcrumb-2">
                            <a href="#" onClick="return false;">Session</a>
                        </li>
                        <li class="breadcrumb-item active">Update</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="row clearfix">
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12" style="margin-bottom: 0px;">
                <div class="card" style="margin-bottom: 0px;">
                    <div class="body">

                        <form [formGroup]="sessionForm" (ngSubmit)="onSubmit()">
                            <div class="row">
                                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12" style="margin-bottom: 0px;">
                                    <mat-form-field class="example-full-width" appearance="outline">
                                        <mat-label>Select Current Session</mat-label>

                                        <mat-select formControlName="sessionId" required>
                                            <mat-option *ngFor="let sessionModel of sessionModels"
                                                [value]="sessionModel.id">
                                                {{sessionModel.name}}
                                            </mat-option>
                                        </mat-select>
                                        <mat-error *ngIf="sessionForm.get('sessionId').hasError('required')">
                                            Please Select Expense Type
                                        </mat-error>
                                    </mat-form-field>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12" style="margin-bottom: 0px;">
                                    <mat-spinner-button [options]="spinnerButtonOptions"
                                        [disabled]="!sessionForm.valid">
                                    </mat-spinner-button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>

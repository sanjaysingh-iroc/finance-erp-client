<section class="content">
    <div class="container-fluid">
        <div class="block-header">
            <div class="row">
                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                    <ul class="breadcrumb breadcrumb-style ">
                        <li class="breadcrumb-item">
                            <h4 class="page-title">{{dialogTitle}} Holiday</h4>
                        </li>
                        <li class="breadcrumb-item bcrumb-1">
                            <a routerLink="/billing/dashboard/staff-dashboard">
                                <i class="fas fa-home"></i> Home</a>
                        </li>
                        <li class="breadcrumb-item bcrumb-2">
                            <a routerLink="/billing/finance/holidays/all-holidays">Holidays</a>
                        </li>
                        <li class="breadcrumb-item active">{{dialogTitle}}</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="row clearfix">
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
                <div class="card">
                    <div class="body">
                        <form class="m-4" [formGroup]="holidayForm" (ngSubmit)="onSubmit()">
                            <div class="row">
                                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                                    <mat-form-field class="example-full-width mb-3" appearance="outline">
                                        <mat-label>Name</mat-label>
                                        <input matInput formControlName="name" required>
                                        <mat-icon matSuffix>beach_access</mat-icon>

                                        <mat-error *ngIf="holidayForm.get('name').hasError('required')">
                                            Enter Holiday Name
                                        </mat-error>
                                    </mat-form-field>
                                </div>
                                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                                    <mat-form-field class="example-full-width mb-3" appearance="outline">
                                        <mat-label>Holiday Date</mat-label>
                                        <input matInput [matDatepicker]="picker" formControlName="holidayDate"
                                            [min]="minDate" [max]="maxDate" disabled required>
                                        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                                        <mat-datepicker #picker disabled="false"></mat-datepicker>
                                        <mat-error *ngIf="holidayForm.get('holidayDate').hasError('required')">
                                            Please select Date of Holiday
                                        </mat-error>
                                    </mat-form-field>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                                    <mat-spinner-button [options]="spinnerButtonOptions"
                                        [disabled]="!holidayForm.valid">
                                    </mat-spinner-button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="content">
    <div class="container-fluid">
        <div class="block-header">
            <div class="row">
                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                    <ul class="breadcrumb breadcrumb-style ">
                        <li class="breadcrumb-item">
                            <h4 class="page-title">Inventory</h4>
                        </li>
                        <li class="breadcrumb-item bcrumb-1">
                            <a routerLink="/billing/dashboard/staff-dashboard">
                                <i class="fas fa-home"></i> Home</a>
                        </li>
                        <li class="breadcrumb-item bcrumb-2">
                            <a routerLink="/billing/finance/billings/all-billings">Inventory</a>
                        </li>
                        <li class="breadcrumb-item active">Add Solar Inventory</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="row clearfix">
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12" style="margin-bottom: 0px;">
                <div class="card" style="margin-bottom: 0px;">

                    <div class="body">

                        <form [formGroup]="billForm" (ngSubmit)="onSubmit()">
                            <ng-container formArrayName="purchaseSolarPanels">
                                <div *ngFor="let  section of purchaseSolarPanels.controls; let i = index">
                                    <div [formGroup]="section">

                                        <div class="row">
                                            <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12"
                                                style="margin-bottom: 0px;">
                                                <mat-form-field class="example-full-width mb-3" appearance="outline">
                                                    <mat-label>Select Product</mat-label>
                                                    <mat-select formControlName="productId">
                                                        <mat-option [value]="">--</mat-option>
                                                        <mat-option *ngFor="let product of solarPanelList"
                                                            [value]="product.id">
                                                            {{product.name}}
                                                        </mat-option>
                                                    </mat-select>
                                                </mat-form-field>
                                            </div>
                                            <div class="col-xl-2 col-lg-2 col-md-12 col-sm-12"
                                                style="margin-bottom: 0px;">
                                                <mat-form-field class="example-full-width" appearance="outline">
                                                    <mat-label>Quantity</mat-label>
                                                    <input matInput formControlName="quantity" type="number">
                                                    <mat-icon matSuffix>class</mat-icon>
                                                </mat-form-field>
                                            </div>
                                            <div class="col-xl-2 col-lg-2 col-md-12 col-sm-12"
                                                style="margin-bottom: 0px;">
                                                <button type="button" mat-button (click)="addNewPanelRow()">
                                                    <mat-icon matSuffix>add_circle</mat-icon>
                                                </button>
                                                <button type="button" *ngIf="i>0" mat-button
                                                    (click)="removeNewPanelRow(i)">
                                                    <mat-icon matSuffix>remove_circle</mat-icon>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </ng-container>

                            <ng-container formArrayName="purchaseSolarInverters">
                                <div *ngFor="let  section of purchaseSolarInverters.controls; let i = index">
                                    <div [formGroup]="section">

                                        <div class="row">
                                            <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12"
                                                style="margin-bottom: 0px;">
                                                <mat-form-field class="example-full-width mb-3" appearance="outline">
                                                    <mat-label>Select Product</mat-label>
                                                    <mat-select formControlName="productId">
                                                        <mat-option [value]="">--</mat-option>
                                                        <mat-option *ngFor="let product of solarInverterList"
                                                            [value]="product.id">
                                                            {{product.name}}
                                                        </mat-option>
                                                    </mat-select>
                                                </mat-form-field>
                                            </div>
                                            <div class="col-xl-2 col-lg-2 col-md-12 col-sm-12"
                                                style="margin-bottom: 0px;">
                                                <mat-form-field class="example-full-width" appearance="outline">
                                                    <mat-label>Quantity</mat-label>
                                                    <input matInput formControlName="quantity" type="number">
                                                    <mat-icon matSuffix>class</mat-icon>
                                                </mat-form-field>
                                            </div>
                                            <div class="col-xl-2 col-lg-2 col-md-12 col-sm-12"
                                                style="margin-bottom: 0px;">
                                                <button type="button" mat-button (click)="addNewInverterRow()">
                                                    <mat-icon matSuffix>add_circle</mat-icon>
                                                </button>
                                                <button type="button" *ngIf="i>0" mat-button
                                                    (click)="removeNewInverterRow(i)">
                                                    <mat-icon matSuffix>remove_circle</mat-icon>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </ng-container>

                            <ng-container formArrayName="purchaseSolarProducts">
                                <div *ngFor="let  section of purchaseSolarProducts.controls; let i = index">
                                    <div [formGroup]="section">

                                        <div class="row">
                                            <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12"
                                                style="margin-bottom: 0px;">
                                                <mat-form-field class="example-full-width mb-3" appearance="outline">
                                                    <mat-label>Select Product</mat-label>
                                                    <mat-select formControlName="productId">
                                                        <mat-option [value]="">--</mat-option>
                                                        <mat-option *ngFor="let product of solarProductList"
                                                            [value]="product.id">
                                                            {{product.name}}
                                                        </mat-option>
                                                    </mat-select>
                                                </mat-form-field>
                                            </div>
                                            <div class="col-xl-2 col-lg-2 col-md-12 col-sm-12"
                                                style="margin-bottom: 0px;">
                                                <mat-form-field class="example-full-width" appearance="outline">
                                                    <mat-label>Quantity</mat-label>
                                                    <input matInput formControlName="quantity" type="number">
                                                    <mat-icon matSuffix>class</mat-icon>
                                                </mat-form-field>
                                            </div>
                                            <div class="col-xl-2 col-lg-2 col-md-12 col-sm-12"
                                                style="margin-bottom: 0px;">
                                                <button type="button" mat-button (click)="addNewRow()">
                                                    <mat-icon matSuffix>add_circle</mat-icon>
                                                </button>
                                                <button type="button" *ngIf="i>0" mat-button (click)="removeNewRow(i)">
                                                    <mat-icon matSuffix>remove_circle</mat-icon>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </ng-container>
                            <ng-container formArrayName="purchaseProducts">
                                <div *ngFor="let  section of purchaseProducts.controls; let i = index">
                                    <div [formGroup]="section">

                                        <div class="row">
                                            <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12"
                                                style="margin-bottom: 0px;">
                                                <mat-form-field class="example-full-width mb-3" appearance="outline">
                                                    <mat-label>Select Product</mat-label>
                                                    <mat-select formControlName="productId" disabled>
                                                        <mat-option [value]="">--</mat-option>
                                                        <mat-option *ngFor="let product of productNameList"
                                                            [value]="product.id">
                                                            {{product.name}}
                                                        </mat-option>
                                                    </mat-select>
                                                </mat-form-field>
                                            </div>
                                            <div class="col-xl-2 col-lg-2 col-md-12 col-sm-12"
                                                style="margin-bottom: 0px;">
                                                <mat-form-field class="example-full-width" appearance="outline">
                                                    <mat-label>Quantity</mat-label>
                                                    <input matInput formControlName="quantity" type="number">
                                                    <mat-icon matSuffix>class</mat-icon>
                                                </mat-form-field>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                            </ng-container>
                            <div class="row" style="margin-top:10px;">
                                <mat-spinner-button [options]="spinnerButtonOptions">
                                </mat-spinner-button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>

    </div>
</section>

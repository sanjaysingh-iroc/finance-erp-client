<section class="content">
  <div class="container-fluid">
    <div class="block-header">
      <div class="row">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
          <ul class="breadcrumb breadcrumb-style ">
            <li class="breadcrumb-item">
              <h4 class="page-title"> Change Password</h4>
            </li>
            <li class="breadcrumb-item bcrumb-1">
              <a routerLink="/pages/dashboard/staff-dashboard">
                <i class="fas fa-home"></i> Home</a>
            </li>

          </ul>
        </div>
      </div>
    </div>
    <div class="row clearfix">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
        <div class="card">
          <div class="body">
            <form class="m-4" [formGroup]="changePassword" (ngSubmit)="onSubmit()">
              <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Old Password</mat-label>
                    <input matInput [type]="oldPasswordHide ? 'password' : 'text'" formControlName="oldPassword"
                      [errorStateMatcher]="matcher" required>
                    <button type="button" mat-icon-button matSuffix (click)="oldPasswordHide = !oldPasswordHide"
                      [attr.aria-label]="'Hide password'" [attr.aria-pressed]="oldPasswordHide">
                      <mat-icon>{{oldPasswordHide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>New Password</mat-label>
                    <input matInput [type]="newPasswordHide ? 'password' : 'text'" formControlName="newPassword"
                      [errorStateMatcher]="matcher" required>
                    <button type="button" mat-icon-button matSuffix (click)="newPasswordHide = !newPasswordHide"
                      [attr.aria-label]="'Hide password'" [attr.aria-pressed]="newPasswordHide">
                      <mat-icon>{{newPasswordHide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <mat-error *ngIf="changePassword.get('newPassword').hasError('required')">
                      Please Add Password
                    </mat-error>
                    <mat-error *ngIf="changePassword.get('newPassword').hasError('notSame')">
                      Old and New Passwords Are Same
                    </mat-error>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Re-Enter Password</mat-label>
                    <input matInput [type]="confirmPasswordHide ? 'password' : 'text'" formControlName="confirmPassword"
                      [errorStateMatcher]="matcher" required>
                    <button type="button" mat-icon-button matSuffix (click)="confirmPasswordHide = !confirmPasswordHide"
                      [attr.aria-label]="'Hide password'" [attr.aria-pressed]="confirmPasswordHide">
                      <mat-icon>{{confirmPasswordHide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <mat-error *ngIf="changePassword.get('confirmPassword').hasError('notSame')">
                      Passwords do not match
                    </mat-error>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                  <mat-spinner-button [options]="spinnerButtonOptions" [disabled]="!changePassword.valid">
                  </mat-spinner-button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="content">
    <div class="container-fluid">
        <div class="block-header">
            <div class="row">
                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                    <ul class="breadcrumb breadcrumb-style ">
                        <li class="breadcrumb-item">
                            <h4 class="page-title">{{dialogTitle}} Staff Loan</h4>
                        </li>
                        <li class="breadcrumb-item bcrumb-1">
                            <a routerLink="/pages/dashboard/staff-dashboard">
                                <i class="fas fa-home"></i> Home</a>
                        </li>
                        <li class="breadcrumb-item bcrumb-2">
                            <a routerLink="/pages/staff/all-staff-loans">Staff Loan</a>
                        </li>
                        <li class="breadcrumb-item active">{{dialogTitle}}</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="row clearfix">
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12" style="margin-bottom: 0px;">
                <div class="card" style="margin-bottom: 0px;">
                    <div class="body">

                        <form [formGroup]="staffLoansForm" (ngSubmit)="onSubmit()">
                            <div class="row">
                                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12" style="margin-bottom: 0px;">
                                    <mat-form-field class="example-full-width" appearance="outline">
                                        <mat-label>Staff Name</mat-label>

                                        <mat-select formControlName="staffId" required>
                                            <mat-option *ngFor="let recipient of staffMap | keyvalue"
                                                [value]="recipient.value.id">
                                                {{recipient.value.name}}
                                            </mat-option>
                                        </mat-select>
                                        <mat-error *ngIf="staffLoansForm.get('staffId').hasError('required')">
                                            Please Select Staff
                                        </mat-error>
                                    </mat-form-field>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12" style="margin-bottom: 0px;">
                                    <mat-form-field class="example-full-width" appearance="outline">
                                        <mat-label>Loan Date</mat-label>
                                        <input matInput [matDatepicker]="picker1" [min]="minDate" [max]="maxDate"
                                            formControlName="staffLoanDate" disabled required>
                                        <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                                        <mat-datepicker #picker1 disabled="false"></mat-datepicker>
                                        <mat-error *ngIf="staffLoansForm.get('staffLoanDate').hasError('required')">
                                            Please select date
                                        </mat-error>
                                    </mat-form-field>
                                </div>

                                <div class=" col-xl-6 col-lg-6 col-md-12 col-sm-12" style="margin-bottom: 0px;">
                                    <mat-form-field class="example-full-width" appearance="outline">
                                        <mat-label>Amount</mat-label>
                                        <input matInput formControlName="amount" type="number" min="0">
                                        <mat-icon matSuffix>currency_rupee</mat-icon>
                                        <mat-error *ngIf="staffLoansForm.get('amount').hasError('min')">
                                            Enter valid amount
                                        </mat-error>
                                    </mat-form-field>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12" style="margin-bottom: 0px;">
                                    <mat-form-field hintLabel="Max 200 characters" class="example-full-width"
                                        appearance="outline">
                                        <mat-label>Comment</mat-label>
                                        <textarea matInput #input maxlength="200" formControlName="comment"></textarea>
                                        <mat-icon matSuffix>description</mat-icon>
                                        <mat-hint align="end">{{input.value?.length || 0}}/200</mat-hint>
                                    </mat-form-field>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12" style="margin-bottom: 0px;">
                                    <mat-spinner-button [options]="spinnerButtonOptions"
                                        [disabled]="!staffLoansForm.valid">
                                    </mat-spinner-button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>
